<div id="meetingPrep" class="tool">
    <h2>Meeting Prep Generator</h2>
    <div class="input-group">
        <label for="meetClientName">Client Name</label>
        <input type="text" id="meetClientName" placeholder="Enter client name">
    </div>
    <div class="input-group">
        <label for="meetType">Meeting Type</label>
        <select id="meetType">
            <option value="">-- Select Meeting Type --</option>
            <option value="Discovery Call">Discovery Call</option>
            <option value="Proposal Review">Proposal Review</option>
            <option value="Progress Update">Progress Update</option>
            <option value="Quarterly Review">Quarterly Review</option>
            <option value="Upsell Conversation">Upsell Conversation</option>
        </select>
    </div>
    <div class="input-group">
        <label for="meetIndustry">Client Industry</label>
        <select id="meetIndustry">
            <option value="">-- Select Industry --</option>
            <option value="Technology">Technology</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Finance">Finance</option>
            <option value="Retail">Retail</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Professional Services">Professional Services</option>
            <option value="Education">Education</option>
            <option value="Real Estate">Real Estate</option>
            <option value="Other">Other</option>
        </select>
    </div>
    <div class="input-group">
        <label for="meetPainPoints">Known Pain Points</label>
        <textarea id="meetPainPoints" rows="3" placeholder="Describe known client pain points..." style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;margin-top:5px;font-family:inherit;box-sizing:border-box;"></textarea>
    </div>
    <div class="input-group">
        <label for="meetPrevNotes">Previous Engagement Notes (optional)</label>
        <textarea id="meetPrevNotes" rows="3" placeholder="Any notes from prior engagements..." style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;margin-top:5px;font-family:inherit;box-sizing:border-box;"></textarea>
    </div>
    <div class="input-group">
        <label for="meetBizOps">Business Operations Score (1-5)</label>
        <input type="number" id="meetBizOps" placeholder="1-5" min="1" max="5" step="0.5">
    </div>
    <div class="input-group">
        <label for="meetTech">Technology Score (1-5)</label>
        <input type="number" id="meetTech" placeholder="1-5" min="1" max="5" step="0.5">
    </div>
    <div class="input-group">
        <label for="meetReadiness">Readiness Score (1-5)</label>
        <input type="number" id="meetReadiness" placeholder="1-5" min="1" max="5" step="0.5">
    </div>
    <button onclick="generateMeetingPrep()">Generate Prep</button>
    <div id="meetingPrepResult"></div>
</div>
