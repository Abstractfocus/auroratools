<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Technologies Tools</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Aurora Technologies Tools</h1>

        <nav class="tool-nav" id="toolNav">
            <button class="tab-btn active" data-target="smbAssessment">SMB Self-Assessment</button>
            <button class="tab-btn" data-target="roiCalculator">ROI Calculator</button>
            <button class="tab-btn" data-target="tcoCalculator">TCO Calculator</button>
            <button class="tab-btn" data-target="timelineEstimator">Timeline Estimator</button>
            <button class="tab-btn" data-target="digitalReadiness">Digital Readiness</button>
            <button class="tab-btn" data-target="benchmarking">Benchmarking</button>
            <button class="tab-btn" data-target="budgetPlanner">Budget Planner</button>
            <button class="tab-btn" data-target="riskAssessment">Risk Assessment</button>
            <button class="tab-btn" data-target="proposalGenerator">Proposal Generator</button>
        </nav>

        <div id="smbAssessment" class="tool">
            <h2>SMB Self-Assessment Tool</h2>
            <div id="questions"></div>
            <button onclick="calculateAssessment()">Calculate Results</button>
            <div id="assessmentResult"></div>
        </div>

        <div id="roiCalculator" class="tool">
            <h2>ROI Calculator</h2>
            <div class="input-group">
                <label for="annualRevenue">Annual Revenue (USD)</label>
                <input type="number" id="annualRevenue" placeholder="Enter annual revenue">
            </div>
            <div class="input-group">
                <label for="employeeCount">Number of Employees</label>
                <input type="number" id="employeeCount" placeholder="Enter number of employees">
            </div>
            <div class="input-group">
                <label for="projectDuration">Project Duration (months)</label>
                <input type="number" id="projectDuration" placeholder="Enter project duration">
            </div>
            <button onclick="calculateROI()">Calculate ROI</button>
            <div id="roiResult"></div>
        </div>

        <div id="tcoCalculator" class="tool">
            <h2>TCO Calculator</h2>
            <div class="input-group">
                <label for="softwareCost">Software/Licensing Cost (USD)</label>
                <input type="number" id="softwareCost" placeholder="Enter software cost">
            </div>
            <div class="input-group">
                <label for="hardwareCost">Hardware Cost (USD)</label>
                <input type="number" id="hardwareCost" placeholder="Enter hardware cost">
            </div>
            <div class="input-group">
                <label for="implementationCost">Implementation Cost (USD)</label>
                <input type="number" id="implementationCost" placeholder="Enter implementation cost">
            </div>
            <div class="input-group">
                <label for="trainingCost">Training Cost (USD)</label>
                <input type="number" id="trainingCost" placeholder="Enter training cost">
            </div>
            <div class="input-group">
                <label for="annualMaintenance">Annual Maintenance Cost (USD)</label>
                <input type="number" id="annualMaintenance" placeholder="Enter annual maintenance cost">
            </div>
            <div class="input-group">
                <label for="yearsOwned">Ownership Period (years)</label>
                <input type="number" id="yearsOwned" placeholder="Enter number of years" min="1">
            </div>
            <button onclick="calculateTCO()">Calculate TCO</button>
            <div id="tcoResult"></div>
        </div>

        <div id="timelineEstimator" class="tool">
            <h2>Project Timeline Estimator</h2>
            <div class="input-group">
                <label for="projectScope">Project Scope</label>
                <select id="projectScope">
                    <option value="">-- Select Scope --</option>
                    <option value="small">Small (single feature/module)</option>
                    <option value="medium">Medium (multi-feature project)</option>
                    <option value="large">Large (full platform/system)</option>
                    <option value="enterprise">Enterprise (organization-wide)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="teamSize">Team Size</label>
                <input type="number" id="teamSize" placeholder="Enter team size" min="1">
            </div>
            <div class="input-group">
                <label for="complexity">Technical Complexity</label>
                <select id="complexity">
                    <option value="">-- Select Complexity --</option>
                    <option value="low">Low (standard tech, clear requirements)</option>
                    <option value="medium">Medium (some integrations, moderate risk)</option>
                    <option value="high">High (complex integrations, new tech)</option>
                    <option value="very_high">Very High (cutting-edge, R&D involved)</option>
                </select>
            </div>
            <button onclick="calculateTimeline()">Estimate Timeline</button>
            <div id="timelineResult"></div>
        </div>

        <div id="digitalReadiness" class="tool">
            <h2>Digital Readiness Score</h2>
            <div id="readinessQuestions"></div>
            <button onclick="calculateReadiness()">Calculate Readiness</button>
            <div id="readinessResult"></div>
        </div>

        <div id="benchmarking" class="tool">
            <h2>Competitive Benchmarking Tool</h2>
            <div class="input-group">
                <label for="benchIndustry">Industry</label>
                <select id="benchIndustry">
                    <option value="">-- Select Industry --</option>
                    <option value="Technology">Technology</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Finance">Finance</option>
                    <option value="Retail">Retail</option>
                    <option value="Manufacturing">Manufacturing</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="input-group">
                <label for="benchRevenue">Annual Revenue (USD)</label>
                <input type="number" id="benchRevenue" placeholder="Enter annual revenue">
            </div>
            <div class="input-group">
                <label for="benchEmployees">Number of Employees</label>
                <input type="number" id="benchEmployees" placeholder="Enter number of employees">
            </div>
            <div class="input-group">
                <label for="benchSatisfaction">Customer Satisfaction Score (1-10)</label>
                <input type="number" id="benchSatisfaction" placeholder="Enter score (1-10)" min="1" max="10">
            </div>
            <div class="input-group">
                <label for="benchMarketShare">Market Share (%)</label>
                <input type="number" id="benchMarketShare" placeholder="Enter market share percentage" min="0" max="100">
            </div>
            <button onclick="calculateBenchmark()">Compare Benchmarks</button>
            <div id="benchmarkResult"></div>
        </div>

        <div id="budgetPlanner" class="tool">
            <h2>Budget Planner Tool</h2>
            <div class="input-group">
                <label for="totalBudget">Total Budget (USD)</label>
                <input type="number" id="totalBudget" placeholder="Enter total budget">
            </div>
            <div class="input-group">
                <label for="budgetPersonnel">Personnel (%)</label>
                <input type="number" id="budgetPersonnel" placeholder="Enter percentage" min="0" max="100">
            </div>
            <div class="input-group">
                <label for="budgetTechnology">Technology (%)</label>
                <input type="number" id="budgetTechnology" placeholder="Enter percentage" min="0" max="100">
            </div>
            <div class="input-group">
                <label for="budgetMarketing">Marketing (%)</label>
                <input type="number" id="budgetMarketing" placeholder="Enter percentage" min="0" max="100">
            </div>
            <div class="input-group">
                <label for="budgetOperations">Operations (%)</label>
                <input type="number" id="budgetOperations" placeholder="Enter percentage" min="0" max="100">
            </div>
            <div class="input-group">
                <label for="budgetTraining">Training (%)</label>
                <input type="number" id="budgetTraining" placeholder="Enter percentage" min="0" max="100">
            </div>
            <div class="input-group">
                <label for="budgetContingency">Contingency (%)</label>
                <input type="number" id="budgetContingency" placeholder="Enter percentage" min="0" max="100">
            </div>
            <button onclick="calculateBudget()">Calculate Budget</button>
            <div id="budgetResult"></div>
        </div>

        <div id="riskAssessment" class="tool">
            <h2>Risk Assessment Matrix</h2>
            <div class="input-group">
                <label for="riskName">Risk Name</label>
                <input type="text" id="riskName" placeholder="Enter risk description">
            </div>
            <div class="input-group">
                <label for="riskLikelihood">Likelihood (1-5)</label>
                <select id="riskLikelihood">
                    <option value="1">1 - Rare</option>
                    <option value="2">2 - Unlikely</option>
                    <option value="3">3 - Possible</option>
                    <option value="4">4 - Likely</option>
                    <option value="5">5 - Almost Certain</option>
                </select>
            </div>
            <div class="input-group">
                <label for="riskImpact">Impact (1-5)</label>
                <select id="riskImpact">
                    <option value="1">1 - Negligible</option>
                    <option value="2">2 - Minor</option>
                    <option value="3">3 - Moderate</option>
                    <option value="4">4 - Major</option>
                    <option value="5">5 - Severe</option>
                </select>
            </div>
            <button onclick="addRisk()">Add Risk</button>
            <button onclick="calculateRiskAssessment()">Generate Assessment</button>
            <div id="riskResult"></div>
        </div>

        <div id="proposalGenerator" class="tool">
            <h2>Proposal Generator</h2>
            <div class="input-group">
                <label for="proposalClientName">Client Name</label>
                <input type="text" id="proposalClientName" placeholder="Enter client name">
            </div>
            <div class="input-group">
                <label for="proposalClientCompany">Client Company</label>
                <input type="text" id="proposalClientCompany" placeholder="Enter client company">
            </div>
            <div class="input-group">
                <label for="proposalIndustry">Industry</label>
                <select id="proposalIndustry">
                    <option value="">-- Select Industry --</option>
                    <option value="Technology">Technology</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Finance">Finance</option>
                    <option value="Retail">Retail</option>
                    <option value="Manufacturing">Manufacturing</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="input-group">
                <label for="proposalEngagement">Engagement Type</label>
                <select id="proposalEngagement">
                    <option value="">-- Select Engagement Type --</option>
                    <option value="Digital Transformation">Digital Transformation</option>
                    <option value="Technology Audit">Technology Audit</option>
                    <option value="Process Optimization">Process Optimization</option>
                    <option value="Cybersecurity Assessment">Cybersecurity Assessment</option>
                    <option value="Custom">Custom</option>
                </select>
            </div>
            <div class="input-group">
                <label for="proposalScope">Scope</label>
                <select id="proposalScope">
                    <option value="">-- Select Scope --</option>
                    <option value="Small">Small</option>
                    <option value="Medium">Medium</option>
                    <option value="Large">Large</option>
                    <option value="Enterprise">Enterprise</option>
                </select>
            </div>
            <div class="input-group">
                <label for="proposalChallenges">Key Challenges</label>
                <textarea id="proposalChallenges" rows="4" placeholder="Describe the key challenges your client is facing..."></textarea>
            </div>
            <div class="input-group">
                <label for="proposalBudget">Budget Range</label>
                <select id="proposalBudget">
                    <option value="">-- Select Budget Range --</option>
                    <option value="$10K-$25K">$10K-$25K</option>
                    <option value="$25K-$50K">$25K-$50K</option>
                    <option value="$50K-$100K">$50K-$100K</option>
                    <option value="$100K-$250K">$100K-$250K</option>
                    <option value="$250K+">$250K+</option>
                </select>
            </div>
            <button onclick="generateProposal()">Generate Proposal</button>
            <div id="proposalResult"></div>
        </div>
    </div>
    <script src="charts.js"></script>
    <script src="export.js"></script>
    <script src="assessment.js"></script>
    <script src="roi.js"></script>
    <script src="tco.js"></script>
    <script src="timeline.js"></script>
    <script src="readiness.js"></script>
    <script src="benchmarking.js"></script>
    <script src="budget.js"></script>
    <script src="risk.js"></script>
    <script src="proposal.js"></script>
    <script src="sharing.js"></script>
    <script src="nav.js"></script>
    <script src="darkmode.js"></script>
</body>
</html>
